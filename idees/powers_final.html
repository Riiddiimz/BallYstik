<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallYstik — 14 pouvoirs (showcase enhanced)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#06070c;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  body{display:flex}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;min-width:0}
  #wrap{position:relative;height:calc(100vh - 28px);max-height:920px;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#03040a;
    box-shadow:0 0 50px -8px rgba(0,242,254,.18),0 0 100px -25px rgba(255,42,133,.18),0 0 0 1px rgba(255,255,255,.06)}
  canvas{display:block;width:100%;height:100%}
  #panel{width:370px;padding:10px;overflow-y:auto;background:rgba(12,14,22,.96);border-left:1px solid #22242e;display:flex;flex-direction:column;gap:6px;font-size:11px}
  h1{font-size:13px;font-weight:900;letter-spacing:.06em;background:linear-gradient(90deg,#00f2fe,#ff2a85);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
  .sect{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#67e8f9;margin:8px 0 3px;display:flex;gap:6px;align-items:center}
  .sect::after{content:'';flex:1;height:1px;background:rgba(103,232,249,.18)}
  .row{display:flex;gap:5px;margin-bottom:5px}
  .row>*{flex:1}
  button,select{padding:7px 9px;border-radius:7px;background:#14161f;border:1px solid #2e303a;color:#e4e4e7;font-size:10px;font-weight:600;cursor:pointer;transition:.12s}
  button:hover,select:hover{border-color:#67e8f9;color:#fff}
  button.on{background:rgba(103,232,249,.12);border-color:#67e8f9;color:#67e8f9}
  button.small{padding:5px 7px;font-size:9px}
  .power{display:grid;grid-template-columns:1fr 40px;gap:4px;padding:8px 9px;border-radius:8px;background:#0f1118;border:1px solid #262836;cursor:pointer;transition:.12s;align-items:center;margin-bottom:3px}
  .power:hover{border-color:var(--c,#67e8f9);transform:translateY(-1px);box-shadow:0 4px 14px -4px var(--c,#67e8f9)}
  .power .pname{font-weight:700;font-size:11px;color:#f4f4f5}
  .power .pdesc{font-size:9px;color:#71717a;margin-top:2px;line-height:1.25}
  .power .picon{font-size:18px;color:var(--c,#67e8f9);text-align:center;text-shadow:0 0 8px var(--c,#67e8f9)}
  .power.new::before{content:'NEW';position:absolute;top:-4px;right:-4px;background:#ff2a85;color:#fff;font-size:7px;font-weight:900;padding:1px 4px;border-radius:4px;letter-spacing:.05em}
  .power{position:relative}
  #status{padding:7px 9px;background:#0f1118;border:1px solid #262836;border-radius:7px;font-size:10px;color:#a1a1aa;min-height:32px;line-height:1.4}
  #ballsList{display:flex;gap:4px;flex-wrap:wrap}
  .ballChip{padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid;transition:.12s}
  .ballChip:hover{transform:scale(1.05)}
  .ballChip.sel{box-shadow:0 0 12px currentColor;background:rgba(255,255,255,.08)}
  @media(max-width:900px){body{flex-direction:column}#stage{height:55vh;padding:6px}#wrap{height:100%;width:auto}#panel{width:100%;height:45vh;border-left:none;border-top:1px solid #22242e}}
</style>
</head>
<body>

<div id="stage"><div id="wrap"><canvas id="cv"></canvas></div></div>

<aside id="panel">
  <h1>BALLYSTIK · SHOWCASE ENHANCED</h1>

  <div class="sect">Boule cible</div>
  <div id="ballsList"></div>

  <div class="sect">Contrôles</div>
  <div class="row">
    <button id="autoBtn" class="on">Auto-démo : ON</button>
    <button id="resetBtn" class="small" style="flex:0 0 70px">Reset</button>
  </div>

  <div id="status">Clique sur un pouvoir pour le lancer.</div>

  <div class="sect">14 pouvoirs</div>
  <div id="powers"></div>
</aside>

<script>
(function(){
'use strict';

const CFG = {
  ballR: 16, ballSpeed: 165, maxHp: 400, regen: 2.5,
  respawn: 1.5, arenaPad: 16, cornerR: 40,
  autoInterval: 2.4,
};

const TAU = Math.PI * 2;
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const easeOut = t => 1 - Math.pow(1-t, 3);

const world = {
  cv:null, ctx:null, W:0, H:0, dpr:1,
  arena:{x:0,y:0,w:0,h:0,cx:0,cy:0,r:0},
  balls:[], projectiles:[], particles:[], shockwaves:[], decoys:[], beams:[], zones:[], damageTexts:[],
  shake:0, shakeDecay:6,
  time:0, autoMode:true, autoTimer:0, selectedBall:1,
};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  world.dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.floor(r.width * world.dpr);
  cv.height = Math.floor(r.height * world.dpr);
  world.W = cv.width; world.H = cv.height;
  const pad = CFG.arenaPad * world.dpr;
  world.arena.x = pad; world.arena.y = pad;
  world.arena.w = world.W - pad*2; world.arena.h = world.H - pad*2;
  world.arena.cx = world.W/2; world.arena.cy = world.H/2;
  world.arena.r = Math.min(world.arena.w, world.arena.h)/2;
  for (const b of world.balls) world.arena.resolve(b);
}

world.arena.resolve = function(ball){
  const a = this, r = ball.r;
  if (ball.x - r < a.x) { ball.x = a.x + r; ball.vx = Math.abs(ball.vx) * 0.98; }
  if (ball.x + r > a.x+a.w) { ball.x = a.x+a.w-r; ball.vx = -Math.abs(ball.vx)*0.98; }
  if (ball.y - r < a.y) { ball.y = a.y + r; ball.vy = Math.abs(ball.vy)*0.98; }
  if (ball.y + r > a.y+a.h) { ball.y = a.y+a.h-r; ball.vy = -Math.abs(ball.vy)*0.98; }
};

function roundRectPath(c,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

world.arena.render = function(c){
  const a = this;
  const bg = c.createRadialGradient(a.cx, a.cy*0.7, 0, a.cx, a.cy, Math.max(a.w,a.h)*0.9);
  bg.addColorStop(0, '#0c1024');
  bg.addColorStop(0.5, '#070912');
  bg.addColorStop(1, '#03040a');
  c.fillStyle = bg; c.fillRect(0,0,world.W,world.H);

  c.save();
  roundRectPath(c, a.x, a.y, a.w, a.h, CFG.cornerR*world.dpr);
  c.clip();
  c.strokeStyle = 'rgba(90,140,230,0.055)';
  c.lineWidth = 1;
  const gs = 44*world.dpr;
  for(let gx=a.x; gx<a.x+a.w; gx+=gs){ c.beginPath(); c.moveTo(gx,a.y); c.lineTo(gx,a.y+a.h); c.stroke(); }
  for(let gy=a.y; gy<a.y+a.h; gy+=gs){ c.beginPath(); c.moveTo(a.x,gy); c.lineTo(a.x+a.w,gy); c.stroke(); }

  const pulse = 0.04 + 0.03*Math.sin(world.time*1.8);
  const amb = c.createRadialGradient(a.cx,a.cy,0,a.cx,a.cy,Math.min(a.w,a.h)*0.6);
  amb.addColorStop(0, `rgba(80,180,255,${pulse})`);
  amb.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = amb; c.fillRect(a.x,a.y,a.w,a.h);
  c.restore();

  c.save();
  const t = world.time;
  const p1 = 0.55 + 0.2*Math.sin(t*1.5);
  const p2 = 0.25 + 0.1*Math.sin(t*2.3+1);
  roundRectPath(c, a.x, a.y, a.w, a.h, CFG.cornerR*world.dpr);
  c.strokeStyle = `rgba(0,242,254,${p1*0.9})`;
  c.shadowColor = 'rgba(0,242,254,0.9)';
  c.shadowBlur = 22*world.dpr*p1;
  c.lineWidth = 2.5*world.dpr;
  c.stroke();
  c.shadowBlur = 0;
  c.strokeStyle = 'rgba(255,255,255,0.35)';
  c.lineWidth = 0.8*world.dpr;
  c.stroke();
  c.strokeStyle = `rgba(255,42,133,${p2})`;
  c.lineWidth = 2*world.dpr;
  c.shadowColor = 'rgba(255,42,133,0.9)';
  c.shadowBlur = 16*world.dpr*p2;
  const cr = CFG.cornerR*world.dpr;
  [[a.x, a.y, 1, 1],[a.x+a.w,a.y,-1,1],[a.x,a.y+a.h,1,-1],[a.x+a.w,a.y+a.h,-1,-1]].forEach(([x,y,dx,dy])=>{
    c.beginPath();
    c.moveTo(x+dx*cr, y+dy*2);
    c.lineTo(x+dx*2, y+dy*2);
    c.lineTo(x+dx*2, y+dy*cr);
    c.stroke();
  });
  c.restore();
};

const BALL_COLORS = ['#ff2a85','#00f2fe','#fbbf24','#a855f7'];

function makeBall(x,y,color,id){
  const a = (id-1) * 1.7 + Math.random()*0.5;
  return {
    id, x, y,
    vx: Math.cos(a)*CFG.ballSpeed,
    vy: Math.sin(a)*CFG.ballSpeed,
    r: CFG.ballR*world.dpr, baseR: CFG.ballR*world.dpr,
    color, alive:true,
    hp: CFG.maxHp, maxHp: CFG.maxHp,
    respawnAt:0, trail:[],
    perturbTimer: rand(0.8, 2.4),
    colossus: 0, prism: 0, invuln: 0,
    _frozen: false,
  };
}

function respawn(b){
  const a = world.arena;
  const idx = b.id - 1;
  const ang = idx/4*TAU + rand(-0.3,0.3);
  b.x = a.cx + Math.cos(ang)*Math.min(a.w,a.h)*0.3;
  b.y = a.cy + Math.sin(ang)*Math.min(a.w,a.h)*0.3;
  const v = Math.random()*TAU;
  b.vx = Math.cos(v)*CFG.ballSpeed;
  b.vy = Math.sin(v)*CFG.ballSpeed;
  b.hp = b.maxHp;
  b.alive = true;
  b.r = b.baseR;
  b.colossus = 0; b.prism = 0;
  b.invuln = 1.2;
  b._frozen = false;
  b.trail.length = 0;
  b.perturbTimer = rand(0.8, 2.4);
}

function damageBall(b, amount, source, ignoreInvuln){
  if(!b.alive) return 0;
  if(b.invuln > 0 && !ignoreInvuln) return 0;
  amount = Math.max(0, amount);
  const dealt = Math.min(b.hp, amount);
  b.hp -= dealt;
  if(dealt > 0.5) spawnDamageText(b.x, b.y - b.r - 10*world.dpr, Math.round(dealt), source);
  if(b.hp <= 0) killBall(b);
  return dealt;
}

function killBall(b){
  if(!b.alive) return;
  b.alive = false;
  b._frozen = false;
  b.respawnAt = world.time + CFG.respawn;
  burstParticles(b.x, b.y, b.color, 40, 460*world.dpr, 0.95);
  burstParticles(b.x, b.y, '#ffffff', 16, 320*world.dpr, 0.5);
  world.shockwaves.push({ x:b.x, y:b.y, r:0, maxR: b.r*8, color: b.color, life: 0.6, maxLife: 0.6, width: 4 });
  world.shockwaves.push({ x:b.x, y:b.y, r:0, maxR: b.r*4.5, color: '#ffffff', life: 0.3, maxLife: 0.3, width: 2.5 });
  world.shake = Math.max(world.shake, 7*world.dpr);
}

function spawnDamageText(x,y,val,source){
  const colorMap = {
    judgment_ray:'#67e8f9', star_hunter:'#fb923c', bomb_shrapnel:'#22d3ee',
    seismic_nova:'#ef4444', magma_rift:'#fb923c', singularity:'#a855f7',
    colossus:'#fbbf24', chain_lightning:'#fbbf24', crystal_prison:'#7dd3fc',
    explosive_flower:'#ec4899', imprisonment_seal:'#a78bfa', 'contact':'#ffffff'
  };
  world.damageTexts.push({
    x, y, val:String(val), color: colorMap[source] || '#ffffff',
    life:0.9, maxLife:0.9,
    vx: rand(-20,20)*world.dpr, vy:-110*world.dpr, scale:0.4
  });
}

function burstParticles(x,y,color,count,speed,life){
  for(let i=0;i<count;i++){
    const a = Math.random()*TAU;
    const s = speed*rand(0.35,1);
    world.particles.push({
      x, y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: life*rand(0.6,1), maxLife: life,
      color, size: rand(1.5,3.5)*world.dpr, drag: 0.94
    });
  }
}

function trailParticle(x,y,color,speed,life,angle,spread){
  const a = angle + rand(-spread,spread);
  const s = speed*rand(0.5,1);
  world.particles.push({
    x, y,
    vx: Math.cos(a)*s, vy: Math.sin(a)*s,
    life: life*rand(0.7,1), maxLife: life,
    color, size: rand(1.5,3)*world.dpr, drag: 0.93
  });
}

function nearestEnemy(ball, maxDist){
  const limit = (maxDist == null ? Infinity : maxDist);
  let best=null, bestD = limit*limit;
  for(const b of world.balls){
    if(b === ball || !b.alive) continue;
    const d2 = (b.x-ball.x)**2 + (b.y-ball.y)**2;
    if(d2 < bestD){ bestD = d2; best = b; }
  }
  return best;
}

function angleTo(a,b){ return Math.atan2(b.y-a.y, b.x-a.x); }

// ══════════════════════════════════════════════════════════════════
// POWERS
// ══════════════════════════════════════════════════════════════════
const POWERS = {};

// ═══ 1. JUDGMENT RAY — ENHANCED ═══
POWERS.judgment_ray = {
  name:'Rayon du Jugement', icon:'⚡', color:'#67e8f9',
  desc:'Ligne laser instantanée qui traverse une cible.',
  cast(ball){
    const target = nearestEnemy(ball);
    if(!target) return;
    const ang = angleTo(ball, target);
    world.beams.push({
      x1: ball.x, y1: ball.y,
      x2: ball.x + Math.cos(ang)*2500*world.dpr,
      y2: ball.y + Math.sin(ang)*2500*world.dpr,
      life: 0.6, maxLife: 0.6,
      state: 'charge', chargeT: 0.4, chargeMax: 0.4,
      targetId: target.id, ang, chargeRingAngle: 0,
    });
  },
  update(dt){
    for(let i = world.beams.length-1; i>=0; i--){
      const b = world.beams[i];
      b.life -= dt;
      if(b.state === 'charge'){
        b.chargeT -= dt;
        b.chargeRingAngle = (b.chargeRingAngle || 0) + dt * 8;
        if(Math.random() < 0.8){
          const dx = Math.cos(b.ang), dy = Math.sin(b.ang);
          const along = rand(60, 400)*world.dpr;
          const perp = rand(-40,40)*world.dpr;
          world.particles.push({
            x: b.x1 + dx*along - dy*perp,
            y: b.y1 + dy*along + dx*perp,
            vx: -dx * 220*world.dpr, vy: -dy * 220*world.dpr,
            life: 0.35, maxLife: 0.35,
            color: '#67e8f9', size: rand(1.2,2.2)*world.dpr, drag: 0.9
          });
        }
        if(b.chargeT <= 0){
          b.state = 'fire';
          b.life = 0.6;
          const target = world.balls.find(x => x.id === b.targetId && x.alive);
          if(target){
            damageBall(target, 38, 'judgment_ray');
            world.shockwaves.push({ x:target.x, y:target.y, r:0, maxR: 70*world.dpr, color:'#67e8f9', life:0.4, maxLife:0.4, width:4 });
            world.shockwaves.push({ x:target.x, y:target.y, r:0, maxR: 40*world.dpr, color:'#ffffff', life:0.25, maxLife:0.25, width:2 });
            burstParticles(target.x, target.y, '#67e8f9', 26, 400*world.dpr, 0.65);
            burstParticles(target.x, target.y, '#ffffff', 12, 260*world.dpr, 0.45);
          }
          const dx = Math.cos(b.ang), dy = Math.sin(b.ang);
          for(let k=0; k<50; k++){
            const t = rand(0.1, 1.4);
            world.particles.push({
              x: b.x1 + dx*500*world.dpr*t,
              y: b.y1 + dy*500*world.dpr*t,
              vx: rand(-120,120)*world.dpr, vy: rand(-120,120)*world.dpr,
              life: 0.6, maxLife: 0.6,
              color: Math.random()<0.5 ? '#67e8f9' : '#ffffff', size: rand(1,2.8)*world.dpr, drag: 0.9
            });
          }
          world.shake = Math.max(world.shake, 6*world.dpr);
        }
      }
      if(b.life <= 0) world.beams.splice(i,1);
    }
  },
  render(c){
    for(const b of world.beams){
      if(b.state === 'charge'){
        const p = 1 - b.chargeT / b.chargeMax;
        c.save();
        c.strokeStyle = `rgba(103,232,249,${0.3 + 0.6*p})`;
        c.lineWidth = (1.5 + p*2.5)*world.dpr;
        c.setLineDash([12*world.dpr, 8*world.dpr]);
        c.shadowColor = '#67e8f9';
        c.shadowBlur = 14*world.dpr*p;
        c.beginPath();
        c.moveTo(b.x1, b.y1);
        c.lineTo(b.x2, b.y2);
        c.stroke();
        c.setLineDash([]);
        // rotating rune circle at origin
        c.globalAlpha = p;
        c.strokeStyle = '#67e8f9';
        c.shadowBlur = 20*world.dpr;
        for(let k=0;k<2;k++){
          const rr = 8*world.dpr + k*5*world.dpr;
          c.beginPath();
          c.arc(b.x1, b.y1, rr, b.chargeRingAngle, b.chargeRingAngle + Math.PI*1.4);
          c.stroke();
        }
        c.restore();
        c.save();
        c.fillStyle = `rgba(255,255,255,${0.6+p*0.4})`;
        c.shadowColor = '#67e8f9';
        c.shadowBlur = 30*world.dpr*p;
        c.beginPath();
        c.arc(b.x1, b.y1, 4*world.dpr + p*8*world.dpr, 0, TAU);
        c.fill();
        c.restore();
      } else {
        const p = b.life / b.maxLife;
        c.save();
        c.globalCompositeOperation = 'lighter';
        c.strokeStyle = `rgba(103,232,249,${p*0.55})`;
        c.lineWidth = 26*world.dpr*p;
        c.shadowColor = '#67e8f9';
        c.shadowBlur = 32*world.dpr;
        c.beginPath(); c.moveTo(b.x1,b.y1); c.lineTo(b.x2,b.y2); c.stroke();
        c.strokeStyle = `rgba(140,245,255,${p*0.95})`;
        c.lineWidth = 10*world.dpr*p;
        c.shadowBlur = 16*world.dpr;
        c.stroke();
        c.strokeStyle = `rgba(255,255,255,${p})`;
        c.lineWidth = 3*world.dpr*p;
        c.shadowBlur = 0;
        c.stroke();
        // flowing energy particles along the beam
        const dx = Math.cos(b.ang), dy = Math.sin(b.ang);
        for(let k=0;k<8;k++){
          const t = ((world.time*3 + k/8) % 1);
          const px = b.x1 + dx*1200*world.dpr*t;
          const py = b.y1 + dy*1200*world.dpr*t;
          c.fillStyle = `rgba(255,255,255,${p*0.9})`;
          c.shadowColor = '#67e8f9';
          c.shadowBlur = 18*world.dpr;
          c.beginPath();
          c.arc(px, py, 4*world.dpr, 0, TAU);
          c.fill();
        }
        c.restore();
      }
    }
  }
};

// ═══ 2. STAR HUNTER — ENHANCED ═══
POWERS.star_hunter = {
  name:'Chasseur Stellaire', icon:'➤', color:'#fb923c',
  desc:'Missile guidé qui poursuit sa cible.',
  cast(ball){
    const target = nearestEnemy(ball);
    if(!target) return;
    const ang = angleTo(ball, target);
    world.projectiles.push({
      type:'missile',
      x: ball.x, y: ball.y,
      vx: Math.cos(ang)*180*world.dpr,
      vy: Math.sin(ang)*180*world.dpr,
      targetId: target.id,
      life: 2.8, maxLife: 2.8, trail: [],
      color: '#fb923c', damage: 26,
      angle: ang, speed: 180*world.dpr, ownerId: ball.id,
    });
  },
  update(){}, render(){},
};

// ═══ 3. BOMB SHRAPNEL — ENHANCED ═══
POWERS.bomb_shrapnel = {
  name:'Bombe à fragmentation', icon:'✦', color:'#22d3ee',
  desc:'Bombe qui explose en 8 fragments radiaux.',
  cast(ball){
    const target = nearestEnemy(ball);
    if(!target) return;
    const ang = angleTo(ball, target);
    world.projectiles.push({
      type:'bomb',
      x: ball.x, y: ball.y,
      vx: Math.cos(ang)*280*world.dpr,
      vy: Math.sin(ang)*280*world.dpr,
      life: 2, maxLife: 2, trail: [],
      color: '#22d3ee', ownerId: ball.id, fuse: 0,
    });
  },
  update(){}, render(){},
};

// ═══ 4. SEISMIC NOVA — ENHANCED ═══
POWERS.seismic_nova = {
  name:'Nova Sismique', icon:'◎', color:'#ef4444',
  desc:'Onde circulaire qui repousse les boules.',
  cast(ball){
    world.shockwaves.push({
      x: ball.x, y: ball.y, r: 0, maxR: 220*world.dpr,
      color: '#ef4444', life: 0.9, maxLife: 0.9, width: 7,

    for(let i=this.entities.length-1;i>=0;i--){
      const e = this.entities[i];
      const owner = world.balls.find(b => b.id === e.ownerId);
      if(e.phase === 'spin'){
        if(!owner || !owner.alive){ this.entities.splice(i,1); continue; }
        e.ownerX = owner.x; e.ownerY = owner.y;
        e.age += dt;
        e.angle += e.spinSpeed * dt;
        const spinP = Math.min(1, e.age / e.spinDur);
        e.radius = 30*world.dpr + (e.maxRadius - 30*world.dpr) * Math.min(1, spinP * 1.35);
        const samples = 20;
        for(let s=0; s<samples; s++){
          if(e.phase === 'link') break;
          const a = e.angle + (s/samples) * TAU;
          const px = e.ownerX + Math.cos(a) * e.radius;
          const py = e.ownerY + Math.sin(a) * e.radius;
          for(const b of world.balls){
            if(!b.alive || b.id === e.ownerId) continue;
            if(e.caughtIds.includes(b.id)) continue;
            const d = Math.hypot(b.x - px, b.y - py);
            if(d < b.r + 10*world.dpr){
              e.caughtIds.push(b.id);
              burstParticles(b.x, b.y, '#fbbf24', 16, 260*world.dpr, 0.5);
              burstParticles(b.x, b.y, '#fef3c7', 10, 200*world.dpr, 0.4);
              world.shockwaves.push({ x:b.x, y:b.y, r:0, maxR:50*world.dpr, color:'#fbbf24', life:0.3, maxLife:0.3, width:2 });
              if(e.caughtIds.length >= 2){
                e.phase = 'link';
                e.linkA = e.caughtIds[0];
                e.linkB = e.caughtIds[1];
                e.linkTimer = e.linkDur;
                break;
              }
            }
          }
        }
        if(e.phase === 'spin' && e.age >= e.spinDur){
          e.phase = 'fade'; e.fadeAge = 0;
        }
      } else if(e.phase === 'link'){
        const a = world.balls.find(b => b.id === e.linkA);
        const b = world.balls.find(bb => bb.id === e.linkB);
        if(!a || !a.alive || !b || !b.alive){ this.entities.splice(i,1); continue; }
        e.linkTimer -= dt;
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 1;
        const ux = dx/dist, uy = dy/dist;
        const pullSpeed = 500*world.dpr;
        a.vx = ux * pullSpeed; a.vy = uy * pullSpeed;
        b.vx = -ux * pullSpeed; b.vy = -uy * pullSpeed;
        const minDist = a.r + b.r + 4*world.dpr;
        if(dist < minDist || e.linkTimer <= 0){
          damageBall(a, 28, 'chain_lightning', true);
          damageBall(b, 28, 'chain_lightning', true);
          const sx = (a.x + b.x)/2, sy = (a.y + b.y)/2;
          world.shake = Math.max(world.shake, 16*world.dpr);
          burstParticles(sx, sy, '#fbbf24', 50, 540*world.dpr, 0.9);
          burstParticles(sx, sy, '#ffffff', 26, 380*world.dpr, 0.6);
          burstParticles(sx, sy, '#fef3c7', 30, 460*world.dpr, 0.75);
          world.shockwaves.push({ x:sx, y:sy, r:0, maxR:260*world.dpr, color:'#fbbf24', life:0.65, maxLife:0.65, width:7 });
          world.shockwaves.push({ x:sx, y:sy, r:0, maxR:160*world.dpr, color:'#ffffff', life:0.4, maxLife:0.4, width:4 });
          a.vx = -ux * 340*world.dpr; a.vy = -uy * 340*world.dpr;
          b.vx = ux * 340*world.dpr; b.vy = uy * 340*world.dpr;
          e.phase = 'fade'; e.fadeAge = 0;
        }
      } else if(e.phase === 'fade'){
        e.fadeAge += dt;
        if(e.fadeAge >= 0.35) this.entities.splice(i,1);
      }
    }
  },
  render(c){
    for(const e of this.entities){
      const flicker = 0.7 + 0.3*Math.sin(world.time*40);
      if(e.phase === 'spin'){
        c.save();
        c.globalCompositeOperation = 'lighter';
        c.lineCap = 'round';
        c.strokeStyle = `rgba(251,191,36,${0.4*flicker})`;
        c.lineWidth = 20*world.dpr;
        c.shadowColor = '#fbbf24';
        c.shadowBlur = 30*world.dpr;
        c.beginPath();
        const samples = 40;
        for(let s=0; s<=samples; s++){
          const a = e.angle + (s/samples)*TAU;
          const px = e.ownerX + Math.cos(a)*e.radius;
          const py = e.ownerY + Math.sin(a)*e.radius;
          if(s===0) c.moveTo(px,py); else c.lineTo(px,py);
        }
        c.stroke();
        c.strokeStyle = `rgba(254,243,199,${0.95*flicker})`;
        c.lineWidth = 5*world.dpr;
        c.shadowBlur = 16*world.dpr;
        c.stroke();
        c.strokeStyle = `rgba(255,255,255,${flicker})`;
        c.lineWidth = 2*world.dpr;
        c.shadowBlur = 0;
        c.stroke();
        const linkCount = 16;
        for(let k=0; k<linkCount; k++){
          const a = e.angle + (k/linkCount)*TAU;
          const px = e.ownerX + Math.cos(a)*e.radius;
          const py = e.ownerY + Math.sin(a)*e.radius;
          c.fillStyle = `rgba(255,255,255,${flicker*0.7})`;
          c.shadowColor = '#fbbf24';
          c.shadowBlur = 16*world.dpr;
          c.beginPath(); c.arc(px, py, 5*world.dpr, 0, TAU); c.fill();
        }
        c.restore();
        for(const bid of e.caughtIds){
          const b = world.balls.find(bb => bb.id === bid);
          if(!b || !b.alive) continue;
          c.save();
          c.globalCompositeOperation = 'lighter';
          const pulse = 0.6 + 0.4*Math.sin(world.time*20);
          c.strokeStyle = `rgba(251,191,36,${0.85*flicker*pulse})`;
          c.lineWidth = 3*world.dpr;
          c.shadowColor = '#fbbf24';
          c.shadowBlur = 20*world.dpr;
          c.beginPath(); c.arc(b.x, b.y, b.r + 10*world.dpr, 0, TAU); c.stroke();
          for(let s=0; s<5; s++){
            const ang = world.time*4 + s*(TAU/5);
            const px = b.x + Math.cos(ang)*(b.r + 8*world.dpr);
            const py = b.y + Math.sin(ang)*(b.r + 8*world.dpr);
            c.fillStyle = `rgba(255,255,255,${flicker})`;
            c.beginPath(); c.arc(px, py, 2.5*world.dpr, 0, TAU); c.fill();
          }
          c.restore();
        }
      } else if(e.phase === 'link'){
        const a = world.balls.find(b => b.id === e.linkA);
        const b = world.balls.find(bb => bb.id === e.linkB);
        if(!a || !a.alive || !b || !b.alive) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx,dy) || 1;
        const ux = dx/dist, uy = dy/dist;
        const nx = -uy, ny = ux;
        c.save();
        c.globalCompositeOperation = 'lighter';
        c.lineCap = 'round';
        const segCount = 14;
        const points = [{x: a.x, y: a.y}];
        for(let i=1; i<segCount; i++){
          const t = i/segCount;
          const px = a.x + dx*t;
          const py = a.y + dy*t;
          const jitter = rand(-12, 12)*world.dpr;
          points.push({ x: px + nx*jitter, y: py + ny*jitter });
        }
        points.push({x: b.x, y: b.y});
        c.strokeStyle = `rgba(251,191,36,${0.45*flicker})`;
        c.lineWidth = 24*world.dpr;
        c.shadowColor = '#fbbf24';
        c.shadowBlur = 32*world.dpr;
        c.beginPath();
        points.forEach((pt, i) => i===0 ? c.moveTo(pt.x,pt.y) : c.lineTo(pt.x,pt.y));
        c.stroke();
        c.strokeStyle = `rgba(254,243,199,${flicker})`;
        c.lineWidth = 6*world.dpr;
        c.shadowBlur = 16*world.dpr;
        c.stroke();
        c.strokeStyle = `rgba(255,255,255,${flicker})`;
        c.lineWidth = 2.5*world.dpr;
        c.shadowBlur = 0;
        c.stroke();
        for(let i=1; i<points.length-1; i++){
          if(Math.random() > 0.5) continue;
          const p = points[i];
          const arcLen = rand(12, 30)*world.dpr;
          const dir = Math.random() < 0.5 ? 1 : -1;
          c.strokeStyle = `rgba(251,191,36,${0.65*flicker})`;
          c.lineWidth = 1.8*world.dpr;
          c.shadowColor = '#fbbf24';
          c.shadowBlur = 12*world.dpr;
          c.beginPath();
          c.moveTo(p.x, p.y);
          c.lineTo(p.x + nx*arcLen*dir + ux*rand(-10,10)*world.dpr, p.y + ny*arcLen*dir + uy*rand(-10,10)*world.dpr);
          c.stroke();
        }
        c.restore();
        for(const bb of [a, b]){
          c.save();
          c.globalCompositeOperation = 'lighter';
          const pulse = 0.6 + 0.4*Math.sin(world.time*22);
          c.strokeStyle = `rgba(251,191,36,${0.9*flicker*pulse})`;
          c.lineWidth = 3.5*world.dpr;
          c.shadowColor = '#fbbf24';
          c.shadowBlur = 22*world.dpr;
          c.beginPath(); c.arc(bb.x, bb.y, bb.r + 10*world.dpr, 0, TAU); c.stroke();
          c.restore();
        }
      } else if(e.phase === 'fade'){
        const fade = 1 - e.fadeAge/0.35;
        for(const bid of e.caughtIds){
          const b = world.balls.find(bb => bb.id === bid);
          if(!b || !b.alive) continue;
          c.save();
          c.globalAlpha = fade;
          c.globalCompositeOperation = 'lighter';
          c.strokeStyle = `rgba(251,191,36,0.6)`;
          c.lineWidth = 2.5*world.dpr;
          c.shadowColor = '#fbbf24';
          c.shadowBlur = 16*world.dpr;
          c.beginPath(); c.arc(b.x, b.y, b.r + 10*world.dpr, 0, TAU); c.stroke();
          c.restore();
        }
      }
    }
  }
};

POWERS.crystal_prison = {
  name:'Prison de Cristal', icon:'❄', color:'#7dd3fc',
  desc:'Pose un piège. Verrouille la boule qui marche dessus.',
  entities: [],
  cast(ball){
    this.entities.push({
      x: ball.x, y: ball.y, ownerId: ball.id,
      age: 0, life: 6.0, maxLife: 6.0,
      trapRadius: 40*world.dpr,
      victimId: null, phase: 'trap', phaseTimer: 0,
      lockDur: 1.1, shatterDur: 0.4,
    });
    burstParticles(ball.x, ball.y, '#7dd3fc', 16, 220*world.dpr, 0.5);
    world.shockwaves.push({ x:ball.x, y:ball.y, r:0, maxR:55*world.dpr, color:'#7dd3fc', life:0.3, maxLife:0.3, width:2 });
  },
  update(dt){
    for(let i=this.entities.length-1;i>=0;i--){
      const e = this.entities[i];
      if(e.phase === 'trap'){
        e.age += dt; e.life -= dt;
        if(e.life <= 0){ this.entities.splice(i,1); continue; }
        for(const b of world.balls){
          if(!b.alive || b.id === e.ownerId) continue;
          const d = Math.hypot(b.x - e.x, b.y - e.y);
          if(d < e.trapRadius + b.r){
            e.phase = 'lock'; e.phaseTimer = e.lockDur;
            e.victimId = b.id;
            b.x = e.x; b.y = e.y; b.vx = 0; b.vy = 0;
            b._frozen = true;
            burstParticles(e.x, e.y, '#7dd3fc', 26, 300*world.dpr, 0.6);
            world.shockwaves.push({ x:e.x, y:e.y, r:0, maxR:100*world.dpr, color:'#7dd3fc', life:0.4, maxLife:0.4, width:3 });
            world.shake = Math.max(world.shake, 7*world.dpr);
            break;
          }
        }
      } else if(e.phase === 'lock'){
        e.phaseTimer -= dt;
        const victim = world.balls.find(b => b.id === e.victimId);
        if(!victim || !victim.alive){ this.entities.splice(i,1); continue; }
        victim.x = e.x; victim.y = e.y;
        victim.vx = 0; victim.vy = 0;
        if(e.phaseTimer <= 0){
          e.phase = 'shatter'; e.phaseTimer = e.shatterDur;
          victim._frozen = false;
          damageBall(victim, 36, 'crystal_prison', true);
          burstParticles(e.x, e.y, '#7dd3fc', 52, 540*world.dpr, 0.9);
          burstParticles(e.x, e.y, '#ffffff', 26, 380*world.dpr, 0.6);
          burstParticles(e.x, e.y, '#a5e8ff', 20, 440*world.dpr, 0.7);
          world.shockwaves.push({ x:e.x, y:e.y, r:0, maxR:180*world.dpr, color:'#7dd3fc', life:0.55, maxLife:0.55, width:6 });
          world.shockwaves.push({ x:e.x, y:e.y, r:0, maxR:110*world.dpr, color:'#ffffff', life:0.35, maxLife:0.35, width:4 });
          world.shake = Math.max(world.shake, 10*world.dpr);
        }
      } else if(e.phase === 'shatter'){
        e.phaseTimer -= dt;
        if(e.phaseTimer <= 0) this.entities.splice(i,1);
      }
    }
  },
  render(c){
    for(const e of this.entities){
      if(e.phase === 'trap'){
        const pulse = 0.5 + 0.5*Math.sin(world.time*4);
        c.save();
        c.strokeStyle = `rgba(125,211,252,${0.45 + 0.3*pulse})`;
        c.lineWidth = 2.5*world.dpr;
        c.shadowColor = '#7dd3fc';
        c.shadowBlur = 16*world.dpr;
        c.beginPath(); c.arc(e.x, e.y, e.trapRadius, 0, TAU); c.stroke();
        for(let i=0; i<8; i++){
          const a = (i/8)*TAU + world.time*0.9;
          const px = e.x + Math.cos(a)*e.trapRadius*0.65;
          const py = e.y + Math.sin(a)*e.trapRadius*0.65;
          c.fillStyle = `rgba(125,211,252,${0.6*pulse + 0.3})`;
          c.beginPath(); c.arc(px, py, 3*world.dpr, 0, TAU); c.fill();
        }
        const g = c.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.trapRadius*0.8);
        g.addColorStop(0, `rgba(125,211,252,${0.22*pulse})`);
        g.addColorStop(1, 'rgba(125,211,252,0)');
        c.fillStyle = g;
        c.beginPath(); c.arc(e.x, e.y, e.trapRadius*0.8, 0, TAU); c.fill();
        c.restore();
      } else if(e.phase === 'lock'){
        const growP = 1 - (e.phaseTimer / e.lockDur);
        const victim = world.balls.find(b => b.id === e.victimId);
        if(victim) drawCrystals(c, e.x, e.y, victim.r, growP, 1);
      } else if(e.phase === 'shatter'){
        const fade = Math.max(0, e.phaseTimer / e.shatterDur);
        const victim = world.balls.find(b => b.id === e.victimId);
        drawCrystals(c, e.x, e.y, victim?.r || 16*world.dpr, 1, fade);
      }
    }
  }
};

function drawCrystals(ctx, x, y, baseR, growP, alpha){
  const N = 6;
  for(let i=0;i<N;i++){
    const ang = (i/N)*TAU - Math.PI/2;
    const len = (24 + 8*Math.sin(world.time*4 + i*2)) * world.dpr * growP;
    const w = 13*world.dpr * growP;
    const cx = x + Math.cos(ang) * (baseR + 12*world.dpr);
    const cy = y + Math.sin(ang) * (baseR + 12*world.dpr);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.rotate(ang + Math.PI/2);
    const grad = ctx.createLinearGradient(0, -len, 0, len*0.4);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, '#a5e8ff');
    grad.addColorStop(1, '#3b82f6');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#7dd3fc';
    ctx.shadowBlur = 22*world.dpr;
    ctx.beginPath();
    ctx.moveTo(0, -len);
    ctx.lineTo(w, -len*0.35);
    ctx.lineTo(w*0.5, len*0.4);
    ctx.lineTo(-w*0.5, len*0.4);
    ctx.lineTo(-w, -len*0.35);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5*world.dpr;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1*world.dpr;
    ctx.beginPath();
    ctx.moveTo(0, -len*0.85);
    ctx.lineTo(0, len*0.35);
    ctx.stroke();
    ctx.restore();
  }
}

POWERS.explosive_flower = {
  name:'Fleur Explosive', icon:'✿', color:'#ec4899',
  desc:'Une fleur se déploie, ses pétales partent en étoile.',
  entities: [],
  cast(ball){
    this.entities.push({
      x: ball.x, y: ball.y, ownerId: ball.id,
      age: 0, bloomDur: 0.85, detonated: false, detonateAge: 0,
    });
  },
  update(dt){
    for(let i=this.entities.length-1;i>=0;i--){
      const e = this.entities[i];
      e.age += dt;
      if(!e.detonated && e.age >= e.bloomDur){
        e.detonated = true;
        const N = 8;
        for(let k=0;k<N;k++){
          const ang = (k/N)*TAU;
          const far = 220*world.dpr;
          for(let dist=20; dist<far; dist+=30*world.dpr){
            const px = e.x + Math.cos(ang)*dist;
            const py = e.y + Math.sin(ang)*dist;
            world.particles.push({
              x: px + rand(-8,8)*world.dpr, y: py + rand(-8,8)*world.dpr,
              vx: rand(-50,50)*world.dpr, vy: rand(-50,50)*world.dpr,
              life: 0.65, maxLife: 0.65,
              color: Math.random()<0.5 ? '#ec4899' : '#fbcfe8',
              size: rand(2,4.5)*world.dpr, drag: 0.9
            });
          }
          for(const b of world.balls){
            if(!b.alive || b.id === e.ownerId) continue;
            const dx = b.x - e.x, dy = b.y - e.y;
            const proj = dx*Math.cos(ang) + dy*Math.sin(ang);
            if(proj < 0 || proj > far) continue;
            const perp = Math.abs(-dx*Math.sin(ang) + dy*Math.cos(ang));
            if(perp < 32*world.dpr){
              damageBall(b, 18, 'explosive_flower');
              b.vx += Math.cos(ang)*200*world.dpr;
              b.vy += Math.sin(ang)*200*world.dpr;
            }
          }
        }
        world.shockwaves.push({ x:e.x, y:e.y, r:0, maxR:240*world.dpr, color:'#ec4899', life:0.6, maxLife:0.6, width:6 });
        world.shake = Math.max(world.shake, 10*world.dpr);
        e.detonateAge = 0;
      }
      if(e.detonated){
        e.detonateAge += dt;
        if(e.detonateAge > 0.7) this.entities.splice(i,1);
      }
    }
  },
  render(c){
    for(const e of this.entities){
      const N = 8;
      if(!e.detonated){
        const bloomP = easeOut(Math.min(1, e.age / e.bloomDur));
        c.save();
        c.globalCompositeOperation = 'lighter';
        const g = c.createRadialGradient(e.x, e.y, 0, e.x, e.y, 70*world.dpr * bloomP);
        g.addColorStop(0, 'rgba(255,255,255,0.95)');
        g.addColorStop(0.4, 'rgba(236,72,153,0.75)');
        g.addColorStop(1, 'rgba(236,72,153,0)');
        c.fillStyle = g;
        c.beginPath(); c.arc(e.x, e.y, 70*world.dpr*bloomP, 0, TAU); c.fill();
        c.restore();
        for(let k=0;k<N;k++){
          const ang = (k/N)*TAU + world.time*0.6;
          const petalLen = 100*world.dpr * bloomP;
          const petalW = 24*world.dpr * bloomP;
          const px = e.x + Math.cos(ang)*petalLen*0.5;
          const py = e.y + Math.sin(ang)*petalLen*0.5;
          c.save();
          c.translate(px, py);
          c.rotate(ang);
          const grad = c.createLinearGradient(-petalLen*0.5, 0, petalLen*0.5, 0);
          grad.addColorStop(0, '#ec4899');
          grad.addColorStop(0.5, '#fbcfe8');
          grad.addColorStop(1, '#ec4899');
          c.fillStyle = grad;
          c.shadowColor = '#ec4899';
          c.shadowBlur = 18*world.dpr;
          c.beginPath();
          c.ellipse(0, 0, petalLen*0.5, petalW*0.5, 0, 0, TAU);
          c.fill();
          c.strokeStyle = '#ffffff';
          c.lineWidth = 1.5*world.dpr;
          c.stroke();
          // petal vein
          c.strokeStyle = 'rgba(255,200,220,0.8)';
          c.lineWidth = 1*world.dpr;
          c.beginPath();
          c.moveTo(-petalLen*0.3, 0);
          c.lineTo(petalLen*0.3, 0);
          c.stroke();
          c.restore();
        }
      } else {
        const fade = 1 - e.detonateAge / 0.7;
        c.save();
        c.globalAlpha = fade;
        c.globalCompositeOperation = 'lighter';
        const g = c.createRadialGradient(e.x, e.y, 0, e.x, e.y, 240*world.dpr);
        g.addColorStop(0, 'rgba(236,72,153,0.65)');
        g.addColorStop(1, 'rgba(236,72,153,0)');
        c.fillStyle = g;
        c.beginPath(); c.arc(e.x, e.y, 240*world.dpr, 0, TAU); c.fill();
        c.restore();
      }
    }
  }
};

// ═══ 14. SCEAU D'EMPRISONNEMENT ═══
POWERS.imprisonment_seal = {

  update(dt){
    for(let i=this.entities.length-1;i>=0;i--){
      const e = this.entities[i];
      e.age += dt;
      if(e.age < e.runeDur) continue;
      if(!e.released){
        for(const b of world.balls){
          if(!b.alive) continue;
          const dx = b.x-e.x, dy = b.y-e.y, d = Math.hypot(dx,dy);
          if(d < e.radius + b.r){
            if(!e.trappedIds.has(b.id)){
              e.trappedIds.add(b.id);
              damageBall(b, 10, 'imprisonment_seal');
            }
            if(d > e.radius - b.r){
              const nx = dx/d, ny = dy/d;
              b.x = e.x + nx*(e.radius - b.r - 2);
              b.y = e.y + ny*(e.radius - b.r - 2);
              const radial = b.vx*nx + b.vy*ny;
              if(radial > 0){ b.vx -= radial*nx; b.vy -= radial*ny; }
            }
          }
        }
        if(e.age >= e.runeDur + e.wallDur){
          e.released = true;
          burstParticles(e.x, e.y, '#a78bfa', 44, 440*world.dpr, 0.85);
          burstParticles(e.x, e.y, '#ffffff', 22, 300*world.dpr, 0.55);
          world.shockwaves.push({ x:e.x, y:e.y, r:0, maxR:e.radius*2.2, color:'#a78bfa', life:0.55, maxLife:0.55, width:5 });
          world.shake = Math.max(world.shake, 9*world.dpr);
        }
      } else {
        e.releaseAge += dt;
        if(e.releaseAge > 0.5) this.entities.splice(i,1);
      }
    }
  },
  render(c){
    for(const e of this.entities){
      if(e.released){
        const fade = 1 - e.releaseAge / 0.5;
        if(fade <= 0) continue;
        c.save();
        c.globalAlpha = fade;
        c.strokeStyle = '#a78bfa';
        c.lineWidth = 2.5*world.dpr;
        c.shadowColor = '#a78bfa';
        c.shadowBlur = 24*world.dpr;
        c.beginPath();
        c.arc(e.x, e.y, e.radius * (1 + (1-fade)*0.8), 0, TAU);
        c.stroke();
        c.restore();
        continue;
      }
      const wallP = e.age < e.runeDur ? 0 : Math.min(1, (e.age - e.runeDur) / 0.35);
      c.save();
      c.globalAlpha = 0.6 + 0.4*Math.sin(world.time*8);
      c.strokeStyle = '#a78bfa';
      c.shadowColor = '#a78bfa';
      c.shadowBlur = 18*world.dpr;
      c.lineWidth = 2.5*world.dpr;
      c.beginPath(); c.arc(e.x, e.y, e.radius, 0, TAU); c.stroke();
      const N = 6;
      c.beginPath();
      for(let i=0;i<=N;i++){
        const ang = (i/N)*TAU + world.time*0.35;
        const px = e.x + Math.cos(ang)*e.radius*0.6;
        const py = e.y + Math.sin(ang)*e.radius*0.6;
        if(i===0) c.moveTo(px,py); else c.lineTo(px,py);
      }
      c.stroke();
      for(let i=0;i<N;i++){
        const ang = (i/N)*TAU + world.time*0.35;
        c.beginPath();
        c.moveTo(e.x, e.y);
        c.lineTo(e.x + Math.cos(ang)*e.radius, e.y + Math.sin(ang)*e.radius);
        c.stroke();
      }
      c.restore();
      if(wallP > 0){
        c.save();
        c.globalCompositeOperation = 'lighter';
        const wallHeight = 70 * wallP * world.dpr;
        const panelCount = 28;
        for(let i=0;i<panelCount;i++){
          const ang = (i/panelCount)*TAU;
          const px = e.x + Math.cos(ang)*e.radius;
          const py = e.y + Math.sin(ang)*e.radius;
          c.save();
          c.translate(px, py);
          c.rotate(ang + Math.PI/2);
          c.globalAlpha = 0.3 + 0.55*Math.sin(world.time*8 + i*0.3);
          c.fillStyle = '#a78bfa';
          c.shadowColor = '#a78bfa';
          c.shadowBlur = 14*world.dpr;
          c.fillRect(-3*world.dpr, -wallHeight, 6*world.dpr, wallHeight);
          c.restore();
        }
        c.restore();
      }
    }
  }
};

// ══════════════════════════════════════════════════════════════════
// PROJECTILES
// ══════════════════════════════════════════════════════════════════
function updateProjectiles(dt){
  for(let i = world.projectiles.length-1; i>=0; i--){
    const p = world.projectiles[i];
    p.life -= dt;
    if(p.type === 'missile'){
      const target = world.balls.find(b=>b.id===p.targetId && b.alive);
      if(target){
        const desired = Math.atan2(target.y - p.y, target.x - p.x);
        let da = desired - p.angle;
        while(da > Math.PI) da -= TAU;
        while(da < -Math.PI) da += TAU;
        p.angle += clamp(da, -3.5*dt, 3.5*dt);
      }
      p.speed = Math.min(p.speed + 140*world.dpr*dt, 420*world.dpr);
      p.vx = Math.cos(p.angle)*p.speed;
      p.vy = Math.sin(p.angle)*p.speed;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.trail.push({x:p.x, y:p.y});
      if(p.trail.length > 22) p.trail.shift();
      if(Math.random()<0.95) trailParticle(p.x, p.y, '#fb923c', 70*world.dpr, 0.45, p.angle+Math.PI, 0.4);
      if(Math.random()<0.5) trailParticle(p.x, p.y, '#fde047', 110*world.dpr, 0.3, p.angle+Math.PI, 0.3);
      for(const b of world.balls){
        if(!b.alive || b.id === p.ownerId) continue;
        if(Math.hypot(b.x-p.x, b.y-p.y) < b.r + 6*world.dpr){
          damageBall(b, p.damage, 'star_hunter');
          world.shockwaves.push({ x:p.x, y:p.y, r:0, maxR:70*world.dpr, color:'#fb923c', life:0.4, maxLife:0.4, width:4 });
          world.shockwaves.push({ x:p.x, y:p.y, r:0, maxR:40*world.dpr, color:'#ffffff', life:0.25, maxLife:0.25, width:2 });
          burstParticles(p.x, p.y, '#fb923c', 24, 380*world.dpr, 0.6);
          burstParticles(p.x, p.y, '#fde047', 14, 260*world.dpr, 0.5);
          world.shake = Math.max(world.shake, 6*world.dpr);
          world.projectiles.splice(i,1);
          break;
        }
      }
    }
    else if(p.type === 'bomb'){
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.fuse += dt;
      if(Math.random()<0.7) trailParticle(p.x, p.y, '#22d3ee', 80*world.dpr, 0.5, Math.atan2(-p.vy,-p.vx), 0.8);
      let hit = false;
      for(const b of world.balls){
        if(!b.alive || b.id === p.ownerId) continue;
        if(Math.hypot(b.x-p.x, b.y-p.y) < b.r + 8*world.dpr){ hit = true; break; }
      }
      const a = world.arena;
      if(p.x < a.x || p.x > a.x+a.w || p.y < a.y || p.y > a.y+a.h) hit = true;
      if(hit){ explodeBomb(p.x, p.y, p.ownerId); world.projectiles.splice(i,1); }
    }
    if(p.type==='missile'){
      const a = world.arena;
      if(p.x < a.x || p.x > a.x+a.w || p.y < a.y || p.y > a.y+a.h){
        burstParticles(p.x, p.y, '#fb923c', 18, 300*world.dpr, 0.5);
        world.projectiles.splice(i,1);
        continue;
      }
    }
    if(p.life <= 0){
      if(p.type==='bomb') explodeBomb(p.x, p.y, p.ownerId);
      world.projectiles.splice(i,1);
    }
  }
}

function explodeBomb(x,y,ownerId){
  world.shockwaves.push({ x,y, r:0, maxR: 150*world.dpr, color:'#22d3ee', life:0.6, maxLife:0.6, width:6 });
  world.shockwaves.push({ x,y, r:0, maxR: 100*world.dpr, color:'#ffffff', life:0.35, maxLife:0.35, width:3.5 });
  world.shockwaves.push({ x,y, r:0, maxR: 60*world.dpr, color:'#a5f3fc', life:0.25, maxLife:0.25, width:2.5 });
  burstParticles(x,y,'#22d3ee', 46, 540*world.dpr, 0.85);
  burstParticles(x,y,'#a5f3fc', 24, 380*world.dpr, 0.65);
  burstParticles(x,y,'#ffffff', 14, 260*world.dpr, 0.45);
  world.shake = Math.max(world.shake, 10*world.dpr);
  for(let i=0;i<10;i++){
    const ang = (i/10)*TAU + rand(-0.1, 0.1);
    world.projectiles.push({
      type:'shrapnel', x, y,
      vx: Math.cos(ang)*380*world.dpr,
      vy: Math.sin(ang)*380*world.dpr,
      life: 0.65, maxLife: 0.65,
      ownerId, color:'#a5f3fc', damage: 9, angle: ang,
    });
  }
  for(const b of world.balls){
    if(!b.alive || b.id === ownerId) continue;
    const d = Math.hypot(b.x-x, b.y-y);
    if(d < 150*world.dpr){
      const f = 1 - d/(150*world.dpr);
      damageBall(b, 24*f, 'bomb_shrapnel');
    }
  }
}

function updateShrapnels(dt){
  for(let i = world.projectiles.length-1; i>=0; i--){
    const p = world.projectiles[i];
    if(p.type !== 'shrapnel') continue;
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.95; p.vy *= 0.95;
    if(Math.random()<0.7) trailParticle(p.x, p.y, '#a5f3fc', 50*world.dpr, 0.35, Math.atan2(-p.vy,-p.vx), 1.0);
    for(const b of world.balls){
      if(!b.alive || b.id === p.ownerId) continue;
      if(Math.hypot(b.x-p.x, b.y-p.y) < b.r + 4*world.dpr){
        damageBall(b, p.damage, 'bomb_shrapnel');
        p.life = 0;
        break;
      }
    }
    if(p.life <= 0) world.projectiles.splice(i,1);
  }
}

// ══════════════════════════════════════════════════════════════════
// BALL AI
// ══════════════════════════════════════════════════════════════════
function updateBallAI(b, dt){
  if(!b.alive) return;
  if(b._frozen){ b.vx = 0; b.vy = 0; b.invuln = Math.max(0, b.invuln - dt); return; }
  b.perturbTimer -= dt;
  if(b.perturbTimer <= 0){
    b.perturbTimer = rand(1.2, 3.0);
    const ang = Math.atan2(b.vy, b.vx) + rand(-0.45, 0.45);
    const sp = Math.hypot(b.vx, b.vy) || CFG.ballSpeed;
    b.vx = Math.cos(ang) * sp;
    b.vy = Math.sin(ang) * sp;
  }
  const sp = Math.hypot(b.vx, b.vy);
  if(sp > 0.01){
    const target = CFG.ballSpeed * (b.colossus > 0 ? 0.7 : 1);
    b.vx = b.vx / sp * target;
    b.vy = b.vy / sp * target;
  }
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  world.arena.resolve(b);
  b.trail.push({x:b.x, y:b.y});
  if(b.trail.length > 14) b.trail.shift();
  if(b.invuln > 0) b.invuln -= dt;
}

function ballCollisions(){
  for(let i=0;i<world.balls.length;i++){
    const a = world.balls[i];
    if(!a.alive) continue;
    for(let j=i+1;j<world.balls.length;j++){
      const b = world.balls[j];
      if(!b.alive) continue;
      const dx = b.x-a.x, dy = b.y-a.y;
      const d = Math.hypot(dx,dy);
      const minD = a.r + b.r;
      if(d < minD && d > 0){
        const nx = dx/d, ny = dy/d;
        const overlap = minD - d;
        a.x -= nx*overlap*0.5; a.y -= ny*overlap*0.5;
        b.x += nx*overlap*0.5; b.y += ny*overlap*0.5;
        const rel = (a.vx-b.vx)*nx + (a.vy-b.vy)*ny;
        if(rel > 0){
          a.vx -= rel*nx; a.vy -= rel*ny;
          b.vx += rel*nx; b.vy += rel*ny;
        }
        if(!a._cT || world.time > a._cT[b.id]){
          a._cT = a._cT || {}; b._cT = b._cT || {};
          const mult = a.colossus > 0 ? 1.6 : 1;
          damageBall(b, 4*mult, 'contact');
          damageBall(a, 4, 'contact');
          a._cT[b.id] = world.time + 0.5;
          b._cT[a.id] = world.time + 0.5;
        }
      }
    }
  }
}

function updateNovas(dt){
  for(const s of world.shockwaves){
    if(s.kind !== 'nova') continue;
    const rNow = s.maxR * (1 - s.life/s.maxLife);
    for(const b of world.balls){
      if(!b.alive || s.hitIds.has(b.id)) continue;
      const d = Math.hypot(b.x - s.sourceX, b.y - s.sourceY);
      if(d < rNow + b.r){
        s.hitIds.add(b.id);
        const ang = Math.atan2(b.y - s.sourceY, b.x - s.sourceX);
        b.vx += Math.cos(ang) * s.knockback;
        b.vy += Math.sin(ang) * s.knockback;
        damageBall(b, 15, 'seismic_nova');
      }
    }
  }
}

// ══════════════════════════════════════════════════════════════════
// UPDATES
// ══════════════════════════════════════════════════════════════════
function updateParticles(dt){
  for(let i=world.particles.length-1; i>=0; i--){
    const p = world.particles[i];
    p.life -= dt;
    if(p.life <= 0){ world.particles.splice(i,1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= (p.drag ?? 0.94);
    p.vy *= (p.drag ?? 0.94);
  }
}

function updateShockwaves(dt){
  for(let i=world.shockwaves.length-1; i>=0; i--){
    const s = world.shockwaves[i];
    s.life -= dt;
    if(s.life <= 0){ world.shockwaves.splice(i,1); continue; }
    s.r = s.maxR * (1 - s.life/s.maxLife);
  }
}

function updateDamageTexts(dt){
  for(let i=world.damageTexts.length-1; i>=0; i--){
    const d = world.damageTexts[i];
    d.life -= dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.vy += 220*world.dpr * dt;
    d.vx *= 0.94;
    d.scale = Math.min(1, d.scale + dt*6);
    if(d.life <= 0) world.damageTexts.splice(i,1);
  }
}

// ══════════════════════════════════════════════════════════════════
// RENDERS
// ══════════════════════════════════════════════════════════════════
function renderParticles(c){
  c.save();
  c.globalCompositeOperation = 'lighter';
  for(const p of world.particles){
    const t = p.life / p.maxLife;
    c.globalAlpha = t;
    c.fillStyle = p.color;
    c.shadowColor = p.color;
    c.shadowBlur = 8*world.dpr;
    c.beginPath();
    c.arc(p.x, p.y, p.size * t, 0, TAU);
    c.fill();
  }
  c.restore();
}

function renderShockwaves(c){
  c.save();
  c.globalCompositeOperation = 'lighter';
  for(const s of world.shockwaves){
    const t = s.life / s.maxLife;
    c.globalAlpha = t;
    c.strokeStyle = s.color;
    c.lineWidth = (s.width ?? 3) * t;
    c.shadowColor = s.color;
    c.shadowBlur = 20*world.dpr;
    c.beginPath();
    c.arc(s.x, s.y, s.r, 0, TAU);
    c.stroke();
  }
  c.restore();
}

function renderDamageTexts(c){
  for(const d of world.damageTexts){
    const t = d.life / d.maxLife;
    c.save();
    c.globalAlpha = Math.min(1, t*2);
    const sz = 16*world.dpr * d.scale;
    c.font = `900 ${sz}px system-ui, sans-serif`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.lineWidth = Math.max(2, sz*0.18);
    c.strokeStyle = 'rgba(0,0,0,0.85)';
    c.strokeText(d.val, d.x, d.y);
    c.fillStyle = d.color;
    c.shadowColor = d.color;
    c.shadowBlur = 8*world.dpr;
    c.fillText(d.val, d.x, d.y);
    c.restore();
  }
}

function renderBalls(c){
  for(const b of world.balls){
    if(!b.alive) continue;
    for(let i=0;i<b.trail.length;i++){
      const t = b.trail[i];
      const a = i / b.trail.length;
      c.save();
      c.globalAlpha = a * 0.35;
      c.fillStyle = b.color;
      c.beginPath();
      c.arc(t.x, t.y, b.r * a * 0.7, 0, TAU);
      c.fill();
      c.restore();
    }
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.shadowColor = b.color;
    c.shadowBlur = 24*world.dpr;
    c.fillStyle = b.color;
    c.beginPath(); c.arc(b.x, b.y, b.r * 0.9, 0, TAU); c.fill();
    c.restore();
    c.save();
    const g = c.createRadialGradient(b.x - b.r*0.35, b.y - b.r*0.35, b.r*0.05, b.x, b.y, b.r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.28, b.color);
    g.addColorStop(1, shade(b.color, -0.35));
    c.fillStyle = g;
    c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU); c.fill();
    c.globalAlpha = 0.85;
    c.fillStyle = 'rgba(255,255,255,0.9)';
    c.beginPath();
    c.ellipse(b.x - b.r*0.32, b.y - b.r*0.4, b.r*0.25, b.r*0.14, -0.6, 0, TAU);
    c.fill();
    c.restore();
    const barW = b.r * 2.8;
    const barH = 4*world.dpr;
    const bx = b.x - barW/2;
    const by = b.y - b.r - 12*world.dpr;
    const hpRatio = b.hp / b.maxHp;
    c.save();
    c.fillStyle = 'rgba(0,0,0,0.7)';
    c.fillRect(bx-2*world.dpr, by-2*world.dpr, barW+4*world.dpr, barH+4*world.dpr);
    c.fillStyle = hpRatio > 0.6 ? '#34d399' : hpRatio > 0.3 ? '#fbbf24' : '#ef4444';
    c.fillRect(bx, by, barW*hpRatio, barH);
    c.restore();
  }
}

function shade(hex, amt){
  const h = hex.replace('#','');
  const r = parseInt(h.substr(0,2),16);
  const g = parseInt(h.substr(2,2),16);
  const b = parseInt(h.substr(4,2),16);
  const f = (v)=>clamp(Math.round(v + 255*amt),0,255);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function renderProjectiles(c){
  for(const p of world.projectiles){
    if(p.type === 'missile'){
      c.save();
      c.globalCompositeOperation = 'lighter';
      for(let i=0;i<p.trail.length;i++){
        const t = p.trail[i];
        const a = i/p.trail.length;
        c.globalAlpha = a * 0.7;
        c.fillStyle = '#fb923c';
        c.beginPath(); c.arc(t.x, t.y, 1 + 7*a*world.dpr, 0, TAU); c.fill();
      }
      c.restore();
      c.save();
      c.translate(p.x, p.y);
      c.rotate(p.angle);
      c.shadowColor = '#fb923c';
      c.shadowBlur = 24*world.dpr;
      c.fillStyle = '#fb923c';
      c.beginPath();
      c.moveTo(10*world.dpr, 0);
      c.lineTo(-7*world.dpr, 6*world.dpr);
      c.lineTo(-4*world.dpr, 0);
      c.lineTo(-7*world.dpr, -6*world.dpr);
      c.closePath();
      c.fill();
      c.fillStyle = '#fff7ed';
      c.beginPath(); c.arc(0,0, 3*world.dpr, 0, TAU); c.fill();
      c.restore();
    }
    else if(p.type === 'bomb'){
      const pulse = 0.5 + 0.5*Math.sin(p.fuse*22);
      c.save();
      c.shadowColor = '#22d3ee';
      c.shadowBlur = (16 + pulse*14)*world.dpr;
      const g = c.createRadialGradient(p.x - 3*world.dpr, p.y - 3*world.dpr, 0, p.x, p.y, (10+pulse*2)*world.dpr);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.4, '#22d3ee');
      g.addColorStop(1, '#0891b2');
      c.fillStyle = g;
      c.beginPath(); c.arc(p.x, p.y, (9 + pulse*2)*world.dpr, 0, TAU); c.fill();
      c.strokeStyle = '#a5f3fc';
      c.lineWidth = 1.5*world.dpr;
      c.beginPath(); c.arc(p.x, p.y, (11 + pulse*2)*world.dpr, 0, TAU); c.stroke();
      c.restore();
    }
    else if(p.type === 'shrapnel'){
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.shadowColor = '#a5f3fc';
      c.shadowBlur = 14*world.dpr;
      c.fillStyle = '#a5f3fc';
      c.beginPath(); c.arc(p.x, p.y, 4*world.dpr, 0, TAU); c.fill();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(p.x, p.y, 1.8*world.dpr, 0, TAU); c.fill();
      c.restore();
    }
  }
}

// ══════════════════════════════════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════════════════════════════════
let lastT = 0;
function tick(now){
  const dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;
  world.time += dt;

  for(const b of world.balls){
    if(!b.alive && world.time >= b.respawnAt) respawn(b);
  }

  if(world.autoMode){
    world.autoTimer -= dt;
    if(world.autoTimer <= 0){
      world.autoTimer = CFG.autoInterval;
      triggerRandomPower();
    }
  }

  for(const b of world.balls) updateBallAI(b, dt);
  ballCollisions();

  for(const k in POWERS) POWERS[k].update(dt);
  updateProjectiles(dt);
  updateShrapnels(dt);
  updateNovas(dt);
  updateParticles(dt);
  updateShockwaves(dt);
  updateDamageTexts(dt);

  world.shake *= Math.exp(-world.shakeDecay * dt);

  const c = ctx;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,world.W,world.H);

  c.save();
  if(world.shake > 0.5){
    c.translate(rand(-world.shake, world.shake), rand(-world.shake, world.shake));
  }

  world.arena.render(c);
  for(const k in POWERS) POWERS[k].render(c);
  renderBalls(c);
  renderProjectiles(c);
  renderParticles(c);
  renderShockwaves(c);
  renderDamageTexts(c);

  c.restore();
  requestAnimationFrame(tick);
}

// ══════════════════════════════════════════════════════════════════
// UI
// ══════════════════════════════════════════════════════════════════
function triggerPower(id){
  const ball = world.balls.find(b=>b.id === world.selectedBall && b.alive);
  if(!ball){ setStatus('Boule morte.'); return; }
  POWERS[id].cast(ball);
  setStatus(`${POWERS[id].name} → Boule #${ball.id}`);
}

function triggerRandomPower(){
  const alive = world.balls.filter(b=>b.alive);
  if(!alive.length) return;
  const ball = alive[Math.floor(Math.random()*alive.length)];
  const keys = Object.keys(POWERS);
  const id = keys[Math.floor(Math.random()*keys.length)];
  POWERS[id].cast(ball);
  if(world.selectedBall !== ball.id){ world.selectedBall = ball.id; refreshBallsList(); }
}

function setStatus(s){ document.getElementById('status').textContent = s; }

function refreshBallsList(){
  const el = document.getElementById('ballsList');
  el.innerHTML = '';
  for(const b of world.balls){
    const chip = document.createElement('div');
    chip.className = 'ballChip' + (world.selectedBall === b.id ? ' sel' : '');
    chip.style.color = b.color; chip.style.borderColor = b.color;
    chip.style.background = world.selectedBall === b.id ? `${b.color}22` : 'transparent';
    chip.textContent = `#${b.id}${b.alive ? '' : ' ✖'}`;
    chip.onclick = () => { world.selectedBall = b.id; refreshBallsList(); setStatus(`Cible : boule #${b.id}`); };
    el.appendChild(chip);
  }
}

const NEW_POWERS = new Set(['chain_lightning','crystal_prison','explosive_flower','imprisonment_seal']);

function buildPowersList(){
  const el = document.getElementById('powers');
  el.innerHTML = '';
  for(const id in POWERS){
    const p = POWERS[id];
    const div = document.createElement('div');
    div.className = 'power' + (NEW_POWERS.has(id) ? ' new' : '');
    div.style.setProperty('--c', p.color);
    div.innerHTML = `
      <div>
        <div class="pname">${p.name}</div>
        <div class="pdesc">${p.desc}</div>
      </div>
      <div class="picon">${p.icon}</div>
    `;
    div.onclick = () => triggerPower(id);
    el.appendChild(div);
  }
}

function init(){
  resize();
  world.balls.length = 0;
  for(let i=0;i<4;i++){
    const b = makeBall(0,0, BALL_COLORS[i], i+1);
    respawn(b); b.invuln = 0;
    world.balls.push(b);
  }
  refreshBallsList();
  buildPowersList();
  lastT = performance.now();
  requestAnimationFrame(tick);

  const autoBtn = document.getElementById('autoBtn');
  autoBtn.onclick = () => {
    world.autoMode = !world.autoMode;
    autoBtn.textContent = 'Auto-démo : ' + (world.autoMode ? 'ON' : 'OFF');
    autoBtn.classList.toggle('on', world.autoMode);
  };
  document.getElementById('resetBtn').onclick = () => {
    world.balls.length = 0;
    world.projectiles.length = 0;
    world.particles.length = 0;
    world.shockwaves.length = 0;
    world.zones.length = 0;
    world.decoys.length = 0;
    world.beams.length = 0;
    world.damageTexts.length = 0;
    for(const k in POWERS) if(POWERS[k].entities) POWERS[k].entities = [];
    world.time = 0;
    for(let i=0;i<4;i++){
      const b = makeBall(0,0,BALL_COLORS[i],i+1);
      respawn(b); b.invuln = 0;
      world.balls.push(b);
    }
    refreshBallsList();
    setStatus('Réinitialisé.');
  };
  window.addEventListener('resize', resize);
}

init();
})();
</script>
