<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallYstik — BallYstik — Refonte des maps</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020205; display: flex; height: 100vh; overflow: hidden; font-family: system-ui, sans-serif; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 14px; }
  #wrap { height: 95vh; aspect-ratio: 9/16; border-radius: 20px; overflow: hidden; box-shadow: 0 0 80px -10px rgba(138,43,226,.2), 0 0 0 1px rgba(255,255,255,.06); background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
  #panel { width: 360px; background: rgba(10,12,18,.95); border-left: 1px solid #22242e; display: flex; flex-direction: column; padding: 15px; gap: 6px; overflow-y: auto; z-index: 10; }
  #panel h1 { font-size: 15px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; background: linear-gradient(90deg,#00f2fe,#ff2a85); -webkit-background-clip: text; color: transparent; margin-bottom: 2px; }
  #panel .subtitle { font-size: 11px; color: #71717a; margin-bottom: 6px; }
  .theme-hdr { font-size: 10px; font-weight: 900; color: #52525b; text-transform: uppercase; letter-spacing: .1em; padding: 10px 4px 4px; border-bottom: 1px solid rgba(255,255,255,.06); margin-top: 4px; }
  .map-item { display: flex; gap: 12px; padding: 9px 12px; border-radius: 10px; cursor: pointer; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); transition: all .15s; align-items: center; flex-shrink: 0; }
  .map-item:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.15); }
  .map-item.active { background: rgba(0,242,254,.08); border-color: rgba(0,242,254,.4); box-shadow: 0 0 15px rgba(0,242,254,.15); }
  .map-item .icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #000; border: 1px solid #333; flex-shrink: 0; font-size: 15px; }
  .map-item.active .icon { border-color: #00f2fe; box-shadow: 0 0 10px rgba(0,242,254,.4); }
  .map-info { flex: 1; }
  .map-name { font-size: 12px; font-weight: 800; color: #fff; margin-bottom: 2px; }
  .map-desc { font-size: 9.5px; color: #a1a1aa; line-height: 1.3; }
  .map-item.active .map-name { color: #00f2fe; }
  #panel::-webkit-scrollbar { width: 5px; }
  #panel::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<div id="stage"><div id="wrap"><canvas id="cv"></canvas></div></div>
<aside id="panel">
  <h1>Arènes & Thèmes</h1>
  <div class="subtitle">4 thèmes · mécaniques environnementales</div>
  <div id="mapList"></div>
</aside>

<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let W, H, DPR, time = 0;
let currentMapIndex = 0;

let rng=(()=>{let a=+new URLSearchParams(location.search).get('seed')||0;return a?()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}:Math.random})();
// --- Physique ---
const BALL_R = 14;
let balls = [];

function initBalls() {
    balls = [];
    const colors = ['#ff2a85', '#00f2fe', '#fbbf24', '#a855f7'];
    const b = { x: 0, y: H * 0.16, w: W * 0.86, h: H * 0.74 };
    for(let i=0; i<4; i++) {
        const margin = BALL_R * DPR * 4;
        const rx = rng() * (b.w - margin*2) + b.x + margin;
        const ry = rng() * (b.h - margin*2) + b.y + margin;
        const angle = rng() * Math.PI * 2;
        const speed = (2.5 + rng()*2) * DPR;
        balls.push({
            x: rx, y: ry,
            vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
            r: BALL_R*DPR, color: colors[i],
            portalCd: 0, slowFactor: 1,
            boosted: false, slowed: false
        });
    }
}

// ══════════════════════════════════════════════════════════════════
// RÉSOLUTION DE COLLISIONS
// ══════════════════════════════════════════════════════════════════

function resolveLine(ball, c) {
    const abx = c.x2 - c.x1, aby = c.y2 - c.y1;
    const apx = ball.x - c.x1, apy = ball.y - c.y1;
    let t = (apx * abx + apy * aby) / (abx * abx + aby * aby || 1);
    t = Math.max(0, Math.min(1, t));
    const px = c.x1 + t * abx, py = c.y1 + t * aby;
    const dx = ball.x - px, dy = ball.y - py;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.001 && dist < ball.r + c.thickness) {
        const nx = dx / dist, ny = dy / dist;
        ball.x = px + nx * (ball.r + c.thickness);
        ball.y = py + ny * (ball.r + c.thickness);
        const dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) { ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny; }
    }
}

function resolvePolygon(ball, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i].x, yi = pts[i].y;
        const xj = pts[j].x, yj = pts[j].y;
        const intersect = ((yi > ball.y) !== (yj > ball.y)) && (ball.x < (xj - xi) * (ball.y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
    }
    let minDist = Infinity, closestPt = null, nx = 0, ny = 0;
    for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        const abx = b.x - a.x, aby = b.y - a.y;
        const apx = ball.x - a.x, apy = ball.y - a.y;
        let t = (apx * abx + apy * aby) / (abx * abx + aby * aby || 1);
        t = Math.max(0, Math.min(1, t));
        const px = a.x + t * abx, py = a.y + t * aby;
        const dx = ball.x - px, dy = ball.y - py;
        const dist = Math.hypot(dx, dy);
        if (dist < minDist) {
            minDist = dist; closestPt = { x: px, y: py };
            if (dist > 0.001) { nx = dx / dist; ny = dy / dist; } else { nx = 1; ny = 0; }
        }
    }
    if (closestPt && minDist < ball.r) {
        if (!inside) {
            ball.x = closestPt.x - nx * ball.r; ball.y = closestPt.y - ny * ball.r;
            const dot = ball.vx * nx + ball.vy * ny;
            if (dot > 0) { ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny; }
        } else {
            ball.x = closestPt.x + nx * ball.r; ball.y = closestPt.y + ny * ball.r;
            const dot = ball.vx * nx + ball.vy * ny;
            if (dot < 0) { ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny; }
        }
    }
}

function resolveRect(ball, c) {
    const closestX = Math.max(c.x, Math.min(ball.x, c.x + c.w));
    const closestY = Math.max(c.y, Math.min(ball.y, c.y + c.h));
    const dx = ball.x - closestX, dy = ball.y - closestY;
    const dist = Math.hypot(dx, dy);
    const pvx = c.vx || 0, pvy = c.vy || 0;

    if (dist > 0.001 && dist < ball.r) {
        const nx = dx / dist, ny = dy / dist;
        ball.x = closestX + nx * ball.r;
        ball.y = closestY + ny * ball.r;
        const rvx = ball.vx - pvx, rvy = ball.vy - pvy;
        const dot = rvx * nx + rvy * ny;
        if (dot < 0) { ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny; }
    } else if (dist <= 0.001) {
        // Balle à l'intérieur de la plateforme : pousse vers l'arête la plus proche
        const left = ball.x - c.x, right = c.x + c.w - ball.x;
        const top = ball.y - c.y, bottom = c.y + c.h - ball.y;
        const m = Math.min(left, right, top, bottom);
        let nx = 0, ny = 0;
        if (m === left) { nx = -1; ball.x = c.x - ball.r; }
        else if (m === right) { nx = 1; ball.x = c.x + c.w + ball.r; }
        else if (m === top) { ny = -1; ball.y = c.y - ball.r; }
        else { ny = 1; ball.y = c.y + c.h + ball.r; }
        const rvx = ball.vx - pvx, rvy = ball.vy - pvy;
        const dot = rvx * nx + rvy * ny;
        if (dot < 0) { ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny; }
    }
}

function resolveCircleBoundary(ball, cx, cy, r) {
    const dx = ball.x - cx, dy = ball.y - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > r - ball.r) {
        const nx = dx / (dist || 1), ny = dy / (dist || 1);
        ball.x = cx + nx * (r - ball.r); ball.y = cy + ny * (r - ball.r);
        const dot = ball.vx * nx + ball.vy * ny;
        if (dot > 0) { ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny; }
    }
}

function resolveBallBall() {
    for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
            const a = balls[i], b = balls[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            const dist = Math.hypot(dx, dy), minDist = a.r + b.r;
            if (dist < minDist && dist > 0) {
                const nx = dx / dist, ny = dy / dist;
                const overlap = minDist - dist;
                a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
                b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
                const relV = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
                if (relV > 0) {
                    a.vx -= relV * nx; a.vy -= relV * ny;
                    b.vx += relV * nx; b.vy += relV * ny;
                }
            }
        }
    }
}

function resolveCollisions() {
    const map = MAPS[currentMapIndex];
    const b = { x: 0, y: H*0.16, w: W*0.86, h: H*0.74, cx: W*0.43, cy: H*0.53, right: W*0.86, bottom: H*0.90 };
    const colliders = map.getColliders(time, b, DPR);
    const boundary = map.getBoundary(b);

    for (const ball of balls) {
        ball.slowFactor = 1;
        ball.boosted = false;
        ball.slowed = false;
        if (ball.portalCd > 0) ball.portalCd -= 1/60;

        if (boundary.type === 'circle') resolveCircleBoundary(ball, boundary.cx, boundary.cy, boundary.r);
        else if (boundary.type === 'poly') resolvePolygon(ball, boundary.pts);

        for (const c of colliders) {
            if (c.type === 'circle') {
                const dx = ball.x - c.x, dy = ball.y - c.y;
                const dist = Math.hypot(dx, dy);
                if (dist < ball.r + c.r) {
                    const nx = dx / (dist || 1), ny = dy / (dist || 1);
                    ball.x = c.x + nx * (ball.r + c.r);
                    ball.y = c.y + ny * (ball.r + c.r);
                    const dot = ball.vx * nx + ball.vy * ny;
                    if (dot < 0) { ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny; }
                }
            } else if (c.type === 'rect') {
                resolveRect(ball, c);
            } else if (c.type === 'poly') {
                resolvePolygon(ball, c.pts);
            } else if (c.type === 'line') {
                resolveLine(ball, c);
            } else if (c.type === 'bumper') {
                const dx = ball.x - c.x, dy = ball.y - c.y, dist = Math.hypot(dx, dy) || 1;
                if (dist < ball.r + c.r) {
                    const nx = dx / dist, ny = dy / dist;
                    ball.x = c.x + nx * (ball.r + c.r); ball.y = c.y + ny * (ball.r + c.r);
                    const sp = Math.max(Math.hypot(ball.vx, ball.vy), c.kick * DPR);
                    ball.vx = nx * sp; ball.vy = ny * sp; if (c.id !== undefined) HIT[c.id] = time;
                }
            } else if (c.type === 'field') {
                let cx, cy, inside;
                if (c.w) { cx = c.x + c.w / 2; cy = c.y + c.h / 2; inside = ball.x > c.x && ball.x < c.x + c.w && ball.y > c.y && ball.y < c.y + c.h; }
                else { cx = c.x; cy = c.y; inside = Math.hypot(ball.x - cx, ball.y - cy) < c.r; }
                if (inside) {
                    const dx = cx - ball.x, dy = cy - ball.y, dd = Math.hypot(dx, dy) || 1;
                    const f = c.r ? 1 - dd / c.r : 1, k = DPR * (c.pull || 0) * f, sw = DPR * (c.sw || 0) * f;
                    ball.vx += (c.ax || 0) * DPR + dx / dd * k - dy / dd * sw;
                    ball.vy += (c.ay || 0) * DPR + dy / dd * k + dx / dd * sw;
                    if (c.slow) ball.slowFactor = Math.min(ball.slowFactor, c.slow);
                }
            } else if (c.type === 'slow_zone') {
                const dist = Math.hypot(ball.x - c.x, ball.y - c.y);
                if (dist < c.r) { ball.slowFactor = 0.5; ball.slowed = true; }
            } else if (c.type === 'boost_zone') {
                const dist = Math.hypot(ball.x - c.x, ball.y - c.y);
                if (dist < c.r) {
                    const sp = Math.hypot(ball.vx, ball.vy) || 1;
                    ball.vx += (ball.vx / sp) * 0.25 * DPR;
                    ball.vy += (ball.vy / sp) * 0.25 * DPR;
                    ball.boosted = true;
                }
            } else if (c.type === 'push_zone') {
                const dx = ball.x - c.x, dy = ball.y - c.y;
                const dist = Math.hypot(dx, dy);
                if (dist < c.r && dist > 1) {
                    const f = (1 - dist / c.r);
                    ball.vx += (dx / dist) * f * 1.2 * DPR;
                    ball.vy += (dy / dist) * f * 1.2 * DPR;
                }
            }
        }

        ball.x += ball.vx * ball.slowFactor;
        ball.y += ball.vy * ball.slowFactor;
        const sp = Math.hypot(ball.vx, ball.vy);
        if (sp > 10 * DPR) { ball.vx = (ball.vx / sp) * 10 * DPR; ball.vy = (ball.vy / sp) * 10 * DPR; }
    }
    resolveBallBall();

    // Portails
    for (const ball of balls) {
        if (map.portalPos && map.portalPos.length > 0 && ball.portalCd <= 0) {
            for (let i = 0; i < map.portalPos.length; i += 2) {
                const p1 = map.portalPos[i], p2 = map.portalPos[i+1];
                if (!p1 || !p2) continue;
                const p1x = b.x + b.w * p1.x, p1y = b.y + b.h * p1.y;
                const p2x = b.x + b.w * p2.x, p2y = b.y + b.h * p2.y;
                if (Math.hypot(ball.x - p1x, ball.y - p1y) < ball.r + 22*DPR) {
                    ball.x = p2x; ball.y = p2y; ball.portalCd = 0.5;
                } else if (Math.hypot(ball.x - p2x, ball.y - p2y) < ball.r + 22*DPR) {
                    ball.x = p1x; ball.y = p1y; ball.portalCd = 0.5;
                }
            }
        }
    }
}

const rectBoundary = (b) => ({ type: 'poly', pts: [
    {x: b.x, y: b.y}, {x: b.right, y: b.y},
    {x: b.right, y: b.bottom}, {x: b.x, y: b.bottom}
]});
const rectPath = (b) => { const p = new Path2D(); p.rect(b.x, b.y, b.w, b.h); return p; };

// ═══ REFONTE DES MAPS — pas de néon : matières, profondeur, mécaniques annoncées ═══
const R=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const sm=(a,b,x)=>Math.max(0,Math.min(1,(x-a)/(b-a)));
const cyc=(t,per,off)=>{const u=t+off;return{s:u%per,n:Math.floor(u/per)}};
const HIT={},TEX={};
const tex=(k,b,fn)=>{k=k+'|'+b.w+'|'+b.h;if(!TEX[k]){const o=document.createElement('canvas');o.width=Math.ceil(b.w);o.height=Math.ceil(b.h);fn(o.getContext('2d'),o.width,o.height,DPR);TEX[k]=o}return TEX[k]};
const sq=id=>Math.max(0,1-(time-(HIT[id]??-9))*3.5);
const P=(b,x,y)=>({x:b.x+b.w*x,y:b.y+b.h*y});
function frame(c,b,d,o,i,leaf,t){
 c.save();c.lineJoin='round';
 c.strokeStyle=o;c.lineWidth=16*d;c.strokeRect(b.x,b.y,b.w,b.h);
 c.strokeStyle=i;c.lineWidth=6*d;c.strokeRect(b.x+3*d,b.y+3*d,b.w-6*d,b.h-6*d);
 if(leaf)for(let k=0;k<44;k++){const u=k/44*2*(b.w+b.h);let x,y;
  if(u<b.w){x=b.x+u;y=b.y}else if(u<b.w+b.h){x=b.right;y=b.y+u-b.w}else if(u<2*b.w+b.h){x=b.right-(u-b.w-b.h);y=b.bottom}else{x=b.x;y=b.bottom-(u-2*b.w-b.h)}
  c.fillStyle=leaf[k%leaf.length];c.beginPath();c.ellipse(x,y,(10+R(k)*8)*d,(4+R(k+1)*3)*d,R(k+2)*6.28+Math.sin(t*1.5+k)*.15,0,7);c.fill()}
 c.restore()}
const base={getBoundary:rectBoundary,getPath:rectPath,portalPos:[]};

// ───────── 1. JUNGLE VIVANTE — champignons bondissants, liane pendule, feuilles qui se fanent, spores ─────────
const JM=[[.25,.3],[.75,.3],[.3,.72],[.7,.68]];
const jst=(t,b,d)=>{
 const mu=JM.map(([x,y],i)=>({...P(b,x,y),r:24*d,id:'m'+i}));
 const a=.85*Math.sin(t*.9),L=b.h*.5,ax=b.cx,ay=b.y+6*d,tip={x:ax+Math.sin(a)*L,y:ay+Math.cos(a)*L};
 const lv=[.3,.7].map((x,i)=>{const{s}=cyc(t,7,i*3.5);const k=s<4?1:s<6?0:sm(6,7,s);return{x:b.x+b.w*x,y:b.cy,w:b.w*.2,h:16*d,k,solid:k>.7,wilt:s<4?sm(3,4,s):0}});
 const{s:fs}=cyc(t,9,0);
 return{mu,ax,ay,tip,lv,fx:b.cx,fy:b.y+b.h*.84,sw:sm(5,8,fs),bu:fs>=8&&fs<8.6?(fs-8)/.6:-1}};
const jungle={...base,theme:'Jungle Vivante',name:'Canopée Vivante',desc:'Champignons-ressorts · liane pendule · feuilles éphémères · fleur à spores',color1:'#6fbf3a',bg:'#0a1407',bg2:'#1b2a0d',
 ground:(c,w,h,d)=>{let g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'#16300f');g.addColorStop(1,'#2a5a1c');c.fillStyle=g;c.fillRect(0,0,w,h);
  for(let i=0;i<420;i++){c.fillStyle=`hsla(${90+R(i)*40},${40+R(i+1)*30}%,${14+R(i+2)*20}%,.5)`;c.beginPath();c.ellipse(R(i+3)*w,R(i+4)*h,(4+R(i+5)*14)*d,(2+R(i+6)*8)*d,R(i+7)*6,0,7);c.fill()}
  c.lineCap='round';for(let i=0;i<9;i++){const x0=R(i)*w,y0=R(i+20)*h;c.strokeStyle='rgba(40,25,12,.8)';c.lineWidth=(3+R(i+9)*6)*d;c.beginPath();c.moveTo(x0,y0);c.bezierCurveTo(x0+(R(i+1)-.5)*200*d,y0+90*d,x0+(R(i+2)-.5)*260*d,y0+200*d,x0+(R(i+3)-.5)*300*d,y0+320*d);c.stroke();c.strokeStyle='rgba(95,65,30,.5)';c.lineWidth=d*1.5;c.stroke()}
  for(let i=0;i<70;i++){c.fillStyle=`hsla(${70+R(i+99)*50},55%,${30+R(i+98)*20}%,.55)`;c.beginPath();c.ellipse(R(i+97)*w,R(i+96)*h,8*d,3.5*d,R(i+95)*6,0,7);c.fill()}},
 drawFrame:(c,b,d,t)=>frame(c,b,d,'#2a190b','#5b3d1c',['#3f7d22','#5fae34','#2f6218'],t),
 getColliders:(t,b,d)=>{const s=jst(t,b,d),o=[];
  s.mu.forEach(m=>o.push({type:'bumper',x:m.x,y:m.y,r:m.r,kick:6,id:m.id}));
  o.push({type:'line',x1:s.ax,y1:s.ay,x2:s.tip.x,y2:s.tip.y,thickness:4*d});
  o.push({type:'bumper',x:s.tip.x,y:s.tip.y,r:12*d,kick:5,id:'pod'});
  s.lv.forEach(l=>{if(l.solid)o.push({type:'rect',x:l.x-l.w/2,y:l.y-l.h/2,w:l.w,h:l.h})});
  if(s.bu>=0)o.push({type:'field',x:s.fx,y:s.fy,r:95*d,pull:-.45});
  return o},
 drawObstacles:(c,b,d,t)=>{const s=jst(t,b,d);
  for(let i=0;i<3;i++){const x=b.x+b.w*(.2+.3*i)+Math.sin(t*.4+i)*30*d,g=c.createLinearGradient(x,b.y,x+90*d,b.bottom);g.addColorStop(0,'rgba(255,240,150,.17)');g.addColorStop(1,'rgba(255,240,150,0)');c.fillStyle=g;c.beginPath();c.moveTo(x,b.y);c.lineTo(x+50*d,b.y);c.lineTo(x+200*d,b.bottom);c.lineTo(x+120*d,b.bottom);c.fill()}

  c.strokeStyle='rgba(60,35,12,.45)';c.lineWidth=2*d;for(let i=1;i<6;i++){c.setLineDash([(10+i*4)*d,(8+i*3)*d]);c.lineDashOffset=t*(14+i*6)*d*(i%2?1:-1);c.beginPath();c.arc(q.x,q.y,q.r*i/6.5,0,7);c.stroke()}c.setLineDash([]);
  c.fillStyle='rgba(240,205,140,.9)';for(let i=0;i<18;i++){const u=1-((t*.35+R(i))%1),a=R(i+5)*6.28+u*2,r=q.r*u;c.beginPath();c.arc(q.x+Math.cos(a)*r,q.y+Math.sin(a)*r,1.8*d,0,7);c.fill()}
  s.pl.forEach(p=>{c.save();c.translate(p.x,p.y);
   if(p.wr>0){c.strokeStyle=`rgba(80,50,20,${p.wr*.7})`;c.lineWidth=3*d;c.beginPath();c.arc(0,0,22*d*(1.6-.6*p.wr),0,7);c.stroke();c.fillStyle=`rgba(235,205,150,${p.wr*.6})`;for(let k=0;k<8;k++){c.beginPath();c.arc(Math.cos(k)*26*d,Math.sin(k*1.7)*18*d-p.wr*10*d,4*d,0,7);c.fill()}}
   if(p.h>0){const sx=p.shake?Math.sin(t*55)*2*d:0;c.fillStyle='rgba(60,35,12,.35)';c.beginPath();c.ellipse(14*d*p.h,10*d*p.h,24*d,15*d,.4,0,7);c.fill();
    c.translate(sx,-10*d*p.h);const cg=c.createRadialGradient(-6*d,-6*d,2*d,0,0,24*d);cg.addColorStop(0,'#f1d9a4');cg.addColorStop(1,'#a8793e');c.fillStyle=cg;c.beginPath();c.arc(0,0,22*d,0,7);c.fill();
    c.strokeStyle='rgba(90,55,20,.7)';c.lineWidth=2*d;c.beginPath();c.arc(0,0,14*d,0,7);c.stroke();if(p.shake){c.beginPath();c.moveTo(-8*d,-12*d);c.lineTo(2*d,0);c.lineTo(-4*d,12*d);c.stroke()}}c.restore()});
  if(s.warn>0){const w=s.warn,y=s.hy,h=b.h/2;c.fillStyle=`rgba(235,190,120,${.2*w})`;c.fillRect(b.x,y,b.w,h);c.strokeStyle=`rgba(255,238,200,${.55*w})`;c.lineWidth=1.5*d;
   for(let i=0;i<26;i++){const x=b.x+(((t*(300+R(i+2)*300)*d*s.dir*(.4+w)+R(i+3)*b.w)%b.w)+b.w)%b.w,yy=y+R(i)*h,L=(60+R(i+1)*100)*d*w;c.beginPath();c.moveTo(x,yy);c.lineTo(x-s.dir*L,yy);c.stroke()}
   c.lineWidth=4*d;c.lineCap='round';for(let k=0;k<3;k++){const x=s.dir>0?b.x+(30+k*18)*d:b.right-(30+k*18)*d,m=y+h/2,a=s.dir*9*d;c.strokeStyle=`rgba(120,70,25,${w*(.4+.4*Math.sin(t*8-k))})`;c.beginPath();c.moveTo(x-a,m-14*d);c.lineTo(x+a,m);c.lineTo(x-a,m+14*d);c.stroke()}}}};

const MAPS=[jungle,volcan,ocean,desert];

function drawMap(c, w, h, dpr, t, mapIndex) {
    const map = MAPS[mapIndex];
    const b = { x: 0, y: h * 0.16, w: w * 0.86, h: h * 0.74, cx: w * 0.43, cy: h * 0.53, right: w * 0.86, bottom: h * 0.90 };
    const bg = c.createLinearGradient(0, 0, w, h); bg.addColorStop(0, map.bg2); bg.addColorStop(1, map.bg);
    c.fillStyle = bg; c.fillRect(0, 0, w, h);
    c.save(); c.beginPath(); c.rect(b.x, b.y, b.w, b.h); c.clip();
    c.drawImage(tex(map.name, b, map.ground), b.x, b.y);
    if (map.drawGround) map.drawGround(c, b, dpr, t);
    map.drawObstacles(c, b, dpr, t);
    c.restore();
    map.drawFrame(c, b, dpr, t);
    const vg = c.createRadialGradient(b.cx, b.cy, b.h * 0.3, b.cx, b.cy, b.h * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.28)');
    c.save(); c.clip(map.getPath(b)); c.fillStyle = vg; c.fillRect(b.x, b.y, b.w, b.h); c.restore();

    // Boules (style préservé)
    balls.forEach(ball => {
        c.save();
        if (ball.boosted) { c.shadowColor = '#ffffff'; c.shadowBlur = 30 * dpr; }
        else if (ball.slowed) { c.shadowColor = '#84cc16'; c.shadowBlur = 22 * dpr; }
        else { c.shadowColor = ball.color; c.shadowBlur = 15 * dpr; }

        c.fillStyle = ball.color;
        c.beginPath(); c.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); c.fill();
        c.strokeStyle = '#fff'; c.lineWidth = 1.5 * dpr; c.stroke();

        c.fillStyle = 'rgba(255,255,255,0.7)';
        c.beginPath(); c.ellipse(ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, ball.r * 0.3, ball.r * 0.15, -0.5, 0, Math.PI * 2); c.fill();

        if (ball.boosted) {
            c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 2 * dpr;
            c.beginPath(); c.arc(ball.x, ball.y, ball.r + 4 * dpr, 0, Math.PI * 2); c.stroke();
        }
        c.restore();
    });
}

// ══════════════════════════════════════════════════════════════════
// PANNEAU UI
// ══════════════════════════════════════════════════════════════════
const mapListEl = document.getElementById('mapList');
const THEME_ICONS = {'Jungle Vivante':'🌿','Volcan en Éruption':'🌋','Océan Fantastique':'🌊','Désert Ancien':'🏜️'};

let lastTheme = null;
MAPS.forEach((m, i) => {
    if (m.theme !== lastTheme) {
        lastTheme = m.theme;
        const hdr = document.createElement('div');
        hdr.className = 'theme-hdr';
        hdr.textContent = (THEME_ICONS[m.theme] || '') + ' ' + m.theme;
        mapListEl.appendChild(hdr);
    }
    const el = document.createElement('div');
    el.className = 'map-item' + (i === 0 ? ' active' : '');
    el.innerHTML =
        `<div class="icon" style="color: ${m.color1}">${THEME_ICONS[m.theme] || '🎮'}</div>` +
        `<div class="map-info"><div class="map-name">${m.name}</div><div class="map-desc">${m.desc}</div></div>`;
    el.onclick = () => {
        document.querySelectorAll('.map-item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        currentMapIndex = i;
        initBalls();
    };
    mapListEl.appendChild(el);
});

// ══════════════════════════════════════════════════════════════════
// BOUCLE PRINCIPALE
// ══════════════════════════════════════════════════════════════════
function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * DPR;
    canvas.height = rect.height * DPR;
    W = canvas.width; H = canvas.height;
    initBalls();
}
window.addEventListener('resize', resize);

let lastT = performance.now();
function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    time += dt;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);

    resolveCollisions();
    drawMap(ctx, W, H, DPR, time, currentMapIndex);

    requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
