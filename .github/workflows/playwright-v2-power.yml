name: Playwright — BallYstik

on:
  push:
    branches:
      - gem_check
  pull_request:
    branches:
      - gem_check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-gem-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser tests
        run: npm run test:e2e

      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ballystik-playwright-results
          path: test-results/
          if-no-files-found: ignore
